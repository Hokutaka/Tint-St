<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link
      rel="stylesheet"
      href="/src/styles.css"
    />

    <title>Tint*</title>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </head>

  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          Tint<span class="star">*</span>
        </div>

        <div class="product">
          Cerune
        </div>
      </header>

      <main class="workspace">
        <!-- LEFT -->
        <section class="panel source-panel">
          <div class="panel-header">
            <div class="source-title">
              <span>Cerune</span>

              <button
                id="file-name"
                class="file-name"
                type="button"
                title="Click to rename"
              >
                Untitled.ceru
              </button>
            </div>

            <div class="file-actions">
              <button
                id="open-button"
                type="button"
              >
                Open
              </button>

              <button
                id="save-button"
                type="button"
              >
                Save
              </button>

              <select
                id="target-select"
                aria-label="Target"
              >
                <option value="x86_64-pc-windows-msvc">
                  Windows x64
                </option>

                <option value="x86_64-unknown-linux-gnu">
                  Linux x86-64
                </option>
              </select>

              <label class="origins-option">
                <input
                  id="origins-toggle"
                  type="checkbox"
                />
                Origins
              </label>

              <button
                id="emit-button"
                type="button"
              >
                Emit
              </button>
            </div>
          </div>
          <div
            id="source-editor"
            aria-label="Cerune source"
          ></div>
        </section>

        <!-- RIGHT -->
        <section class="panel output-panel">
          <div class="tabs">
          <button
            class="tab"
            data-output="sources"
            type="button"
          >
            Sources
          </button>

          <button
            class="tab active"
            data-output="ir"
            type="button"
          >
            Cerune IR
          </button>

          <button
            class="tab"
            data-output="c"
            type="button"
          >
            C
          </button>

          <button
            class="tab"
            data-output="cAsm"
            type="button"
          >
            C ASM
          </button>

          <button
            class="tab"
            data-output="llvm"
            type="button"
          >
            LLVM IR
          </button>

          <button
            class="tab"
            data-output="llvmAsm"
            type="button"
          >
            LLVM ASM
          </button>

          <button
            class="tab"
            data-output="wat"
            type="button"
          >
            WAT
          </button>

          <button
            class="tab"
            data-output="qbe"
            type="button"
          >
            QBE IR
          </button>

          <button
            class="tab"
            data-output="qbeAsm"
            type="button"
          >
            QBE ASM
          </button>

          <button
            class="tab"
            data-output="directAsm"
            type="button"
          >
            Direct ASM
          </button>

          <button
            class="tab"
            data-output="object"
            type="button"
          >
            Object
          </button>

          <button
            class="tab"
            data-output="bytecode"
            type="button"
          >
            Bytecode
          </button>

          <button
            class="tab"
            data-output="vmOutput"
            type="button"
          >
            VM Output
          </button>
        </div>
          <pre id="output">Press Emit to generate code.</pre>
        </section>
      </main>

      <footer class="statusbar">
        <div class="status">
          <span
            id="status-dot"
            class="status-dot"
          ></span>

          <span id="status-text">
            Ready
          </span>
        </div>

        <span class="shortcut">
          Ctrl + Enter
        </span>
      </footer>
    </div>
  </body>
</html>

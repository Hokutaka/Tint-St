<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link
      rel="stylesheet"
      href="/src/styles.css"
    />

    <title>Tint*</title>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </head>

  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          Tint<span class="star">*</span>
        </div>

        <div class="product">
          Primer
        </div>
      </header>

      <main class="workspace">
        <!-- LEFT -->
        <section class="panel source-panel">
          <div class="panel-header">
            <div class="source-title">
              <span>Primer</span>

              <button
                id="file-name"
                class="file-name"
                type="button"
                title="Click to rename"
              >
                Untitled.prim
              </button>
            </div>

            <div class="file-actions">
              <button
                id="open-button"
                type="button"
              >
                Open
              </button>

              <button
                id="save-button"
                type="button"
              >
                Save
              </button>

              <button
                id="emit-button"
                type="button"
              >
                Emit
              </button>
            </div>
          </div>
          <div
            id="source-editor"
            aria-label="Primer source"
          ></div>
        </section>

        <!-- RIGHT -->
        <section class="panel output-panel">
          <div class="tabs">
            <button
              class="tab active"
              data-output="c"
              type="button"
            >
              C
            </button>

            <button
              class="tab"
              data-output="llvm"
              type="button"
            >
              LLVM IR
            </button>

            <button
              class="tab"
              data-output="wat"
              type="button"
            >
              WAT
            </button>
          </div>

          <pre id="output">Press Emit to generate code.</pre>
        </section>
      </main>

      <footer class="statusbar">
        <div class="status">
          <span
            id="status-dot"
            class="status-dot"
          ></span>

          <span id="status-text">
            Ready
          </span>
        </div>

        <span class="shortcut">
          Ctrl + Enter
        </span>
      </footer>
    </div>
  </body>
</html>
